<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">GeoAI Resilience capability infographic</title><desc id="desc">Statistical overview of five programs, two desktop GIS views and demonstrated capabilities.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#100019"/><stop offset="1" stop-color="#301545"/></linearGradient><filter id="sh"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-opacity=".25"/></filter><style>.h{font:700 38px Arial;fill:#f3c64e}.sub{font:400 18px Arial;fill:#d9cce5}.big{font:700 62px Arial;fill:#f3c64e}.label{font:700 17px Arial;fill:#fff}.small{font:400 14px Arial;fill:#d9cce5}.card{fill:#2d1542;stroke:#6e4c84;stroke-width:2}.barbg{fill:#4a315b}.bar{fill:#f3c64e}.green{fill:#55c99a}.coral{fill:#ff776d}.blue{fill:#5cc8ee}</style></defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="80" y="78" class="h">GeoAI Resilience · Capability Snapshot</text><text x="80" y="112" class="sub">Repository and live-suite coverage — demonstrative metrics, not operational performance claims</text>
  <g filter="url(#sh)"><rect x="70" y="160" width="260" height="170" rx="18" class="card"/><text x="100" y="235" class="big">5</text><text x="100" y="280" class="label">Research programs</text><text x="100" y="307" class="small">Urban · Flood · Utility</text>
    <rect x="370" y="160" width="260" height="170" rx="18" class="card"/><text x="400" y="235" class="big">2</text><text x="400" y="280" class="label">Desktop GIS views</text><text x="400" y="307" class="small">ArcGIS Pro + QGIS</text>
    <rect x="670" y="160" width="260" height="170" rx="18" class="card"/><text x="700" y="235" class="big">5×2</text><text x="700" y="280" class="label">Program workbenches</text><text x="700" y="307" class="small">Program-specific data &amp; tools</text>
    <rect x="970" y="160" width="260" height="170" rx="18" class="card"/><text x="1000" y="235" class="big">1</text><text x="1000" y="280" class="label">Shared result contract</text><text x="1000" y="307" class="small">Map · metrics · export parity</text>
    <rect x="1270" y="160" width="260" height="170" rx="18" class="card"/><text x="1300" y="235" class="big">3</text><text x="1300" y="280" class="label">Approval safeguards</text><text x="1300" y="307" class="small">Evidence · confidence · human</text></g>
  <text x="80" y="405" class="h" font-size="28">Capability coverage</text>
  <g><text x="80" y="462" class="label">Spatial validation &amp; projected CRS</text><rect x="450" y="440" width="900" height="25" rx="12" class="barbg"/><rect x="450" y="440" width="900" height="25" rx="12" class="bar"/><text x="1380" y="460" class="label">5 / 5</text>
    <text x="80" y="522" class="label">Layer controls &amp; attribute results</text><rect x="450" y="500" width="900" height="25" rx="12" class="barbg"/><rect x="450" y="500" width="900" height="25" rx="12" class="green"/><text x="1380" y="520" class="label">5 / 5</text>
    <text x="80" y="582" class="label">ArcGIS Pro workflow pathway</text><rect x="450" y="560" width="900" height="25" rx="12" class="barbg"/><rect x="450" y="560" width="900" height="25" rx="12" class="coral"/><text x="1380" y="580" class="label">5 / 5</text>
    <text x="80" y="642" class="label">QGIS Processing pathway</text><rect x="450" y="620" width="900" height="25" rx="12" class="barbg"/><rect x="450" y="620" width="900" height="25" rx="12" class="blue"/><text x="1380" y="640" class="label">5 / 5</text>
    <text x="80" y="702" class="label">Traceable exports &amp; provenance</text><rect x="450" y="680" width="900" height="25" rx="12" class="barbg"/><rect x="450" y="680" width="900" height="25" rx="12" class="bar"/><text x="1380" y="700" class="label">5 / 5</text></g>
  <g filter="url(#sh)"><rect x="70" y="770" width="1460" height="80" rx="16" class="card"/><text x="100" y="805" class="label">Production-readiness principle</text><text x="100" y="832" class="small">Authoritative data + calibrated models + native GIS services + accuracy reports + human approval before operational action.</text></g>
</svg>
